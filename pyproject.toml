[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profesora-ingles"
version = "0.2.0"
description = "Profesora de inglés con IA, hablada, para aprender desde cero."
readme = "README.md"
requires-python = ">=3.11,<3.15"

[tool.setuptools.packages.find]
include = ["profesora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
